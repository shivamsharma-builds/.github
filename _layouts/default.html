<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}">Shivam Sharma</a>
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/blogs/' | relative_url }}">Blogs</a>
      <a href="{{ '/#journey' | relative_url }}">Journey</a>
      <a href="{{ '/#projects' | relative_url }}">Projects</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>
<main>{{ content }}</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <span>© {{ 'now' | date: '%Y' }} Shivam Sharma</span>
    <a href="https://github.com/shivamsharma-builds">GitHub</a>
  </div>
</footer>
<script>
const b=document.querySelector('.menu-toggle'),n=document.querySelector('.site-nav');
if(b){b.addEventListener('click',()=>{const open=n.classList.toggle('open');b.setAttribute('aria-expanded',open)})}
</script>
</body>
</html>
