<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="header"><div class="wrap nav">
<a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
<nav>{% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}</nav>
</div></header>
<main>{{ content }}</main>
<footer><div class="wrap">© {{ 'now' | date: '%Y' }} {{ site.data.profile.name }} · Built with Jekyll</div></footer>
</body>
</html>
