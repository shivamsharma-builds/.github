---
layout: default
---
<article class="container article">
  <p class="eyebrow">DevOps Blog</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  {% if page.date %}<p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>{% endif %}
  <hr>
  {{ content }}
</article>
